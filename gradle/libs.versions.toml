[versions]
agp = "8.13.2"
kotlin = "2.3.21"
ksp = "2.3.21-2.0.5"

# Mozilla Android Components. GeckoView comes in transitively from
# browser-engine-gecko, so it is deliberately not pinned separately.
mozac = "153.0"

coroutines = "1.10.2"
androidxCore = "1.17.0"
androidxAppcompat = "1.7.1"
androidxActivity = "1.11.0"
androidxFragment = "1.8.9"
androidxLifecycle = "2.9.4"
androidxWork = "2.10.5"
androidxDatastore = "1.1.7"
androidxSecurity = "1.1.0"
androidxRecyclerview = "1.4.0"
androidxConstraintlayout = "2.2.1"
androidxCoordinatorlayout = "1.3.0"
androidxSwiperefresh = "1.1.0"
androidxPreference = "1.2.1"
androidxNavigation = "2.9.5"
material = "1.13.0"
serialization = "1.9.0"

junit = "4.13.2"
androidxTestJunit = "1.3.0"
androidxTestCore = "1.7.0"
androidxTestRunner = "1.7.0"
espresso = "3.7.0"
robolectric = "4.16"
mockito = "5.20.0"
mockitoKotlin = "5.5.0"

[libraries]
# --- Mozilla Android Components: engine + state ---
mozac-browser-engine-gecko = { module = "org.mozilla.components:browser-engine-gecko", version.ref = "mozac" }
mozac-browser-state = { module = "org.mozilla.components:browser-state", version.ref = "mozac" }
mozac-browser-session-storage = { module = "org.mozilla.components:browser-session-storage", version.ref = "mozac" }
mozac-browser-storage-sync = { module = "org.mozilla.components:browser-storage-sync", version.ref = "mozac" }
mozac-browser-domains = { module = "org.mozilla.components:browser-domains", version.ref = "mozac" }
mozac-browser-errorpages = { module = "org.mozilla.components:browser-errorpages", version.ref = "mozac" }
mozac-browser-icons = { module = "org.mozilla.components:browser-icons", version.ref = "mozac" }
mozac-browser-menu = { module = "org.mozilla.components:browser-menu", version.ref = "mozac" }
mozac-browser-menu2 = { module = "org.mozilla.components:browser-menu2", version.ref = "mozac" }
mozac-browser-tabstray = { module = "org.mozilla.components:browser-tabstray", version.ref = "mozac" }
mozac-browser-thumbnails = { module = "org.mozilla.components:browser-thumbnails", version.ref = "mozac" }
mozac-browser-toolbar = { module = "org.mozilla.components:browser-toolbar", version.ref = "mozac" }

# --- Mozilla Android Components: concepts ---
mozac-concept-awesomebar = { module = "org.mozilla.components:concept-awesomebar", version.ref = "mozac" }
mozac-concept-engine = { module = "org.mozilla.components:concept-engine", version.ref = "mozac" }
mozac-concept-fetch = { module = "org.mozilla.components:concept-fetch", version.ref = "mozac" }
mozac-concept-menu = { module = "org.mozilla.components:concept-menu", version.ref = "mozac" }
mozac-concept-storage = { module = "org.mozilla.components:concept-storage", version.ref = "mozac" }
mozac-concept-toolbar = { module = "org.mozilla.components:concept-toolbar", version.ref = "mozac" }

# --- Mozilla Android Components: features ---
mozac-feature-app-links = { module = "org.mozilla.components:feature-app-links", version.ref = "mozac" }
mozac-feature-awesomebar = { module = "org.mozilla.components:feature-awesomebar", version.ref = "mozac" }
mozac-feature-contextmenu = { module = "org.mozilla.components:feature-contextmenu", version.ref = "mozac" }
mozac-feature-downloads = { module = "org.mozilla.components:feature-downloads", version.ref = "mozac" }
mozac-feature-findinpage = { module = "org.mozilla.components:feature-findinpage", version.ref = "mozac" }
mozac-feature-intent = { module = "org.mozilla.components:feature-intent", version.ref = "mozac" }
mozac-feature-logins = { module = "org.mozilla.components:feature-logins", version.ref = "mozac" }
mozac-feature-media = { module = "org.mozilla.components:feature-media", version.ref = "mozac" }
mozac-feature-prompts = { module = "org.mozilla.components:feature-prompts", version.ref = "mozac" }
mozac-feature-readerview = { module = "org.mozilla.components:feature-readerview", version.ref = "mozac" }
mozac-feature-search = { module = "org.mozilla.components:feature-search", version.ref = "mozac" }
mozac-feature-session = { module = "org.mozilla.components:feature-session", version.ref = "mozac" }
mozac-feature-sitepermissions = { module = "org.mozilla.components:feature-sitepermissions", version.ref = "mozac" }
mozac-feature-tabs = { module = "org.mozilla.components:feature-tabs", version.ref = "mozac" }
mozac-feature-toolbar = { module = "org.mozilla.components:feature-toolbar", version.ref = "mozac" }
mozac-feature-top-sites = { module = "org.mozilla.components:feature-top-sites", version.ref = "mozac" }
mozac-feature-webcompat = { module = "org.mozilla.components:feature-webcompat", version.ref = "mozac" }

# --- Mozilla Android Components: libs, support, ui ---
mozac-lib-dataprotect = { module = "org.mozilla.components:lib-dataprotect", version.ref = "mozac" }
mozac-lib-fetch-httpurlconnection = { module = "org.mozilla.components:lib-fetch-httpurlconnection", version.ref = "mozac" }
mozac-service-sync-logins = { module = "org.mozilla.components:service-sync-logins", version.ref = "mozac" }
mozac-lib-publicsuffixlist = { module = "org.mozilla.components:lib-publicsuffixlist", version.ref = "mozac" }
mozac-lib-state = { module = "org.mozilla.components:lib-state", version.ref = "mozac" }
mozac-support-appservices = { module = "org.mozilla.components:support-appservices", version.ref = "mozac" }
mozac-support-base = { module = "org.mozilla.components:support-base", version.ref = "mozac" }
mozac-support-ktx = { module = "org.mozilla.components:support-ktx", version.ref = "mozac" }
mozac-support-utils = { module = "org.mozilla.components:support-utils", version.ref = "mozac" }
mozac-support-webextensions = { module = "org.mozilla.components:support-webextensions", version.ref = "mozac" }
mozac-ui-colors = { module = "org.mozilla.components:ui-colors", version.ref = "mozac" }
mozac-ui-icons = { module = "org.mozilla.components:ui-icons", version.ref = "mozac" }
mozac-ui-tabcounter = { module = "org.mozilla.components:ui-tabcounter", version.ref = "mozac" }
mozac-ui-widgets = { module = "org.mozilla.components:ui-widgets", version.ref = "mozac" }

# --- Kotlin / AndroidX ---
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppcompat" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "androidxActivity" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "androidxFragment" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "androidxLifecycle" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "androidxWork" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidxDatastore" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "androidxSecurity" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "androidxRecyclerview" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "androidxConstraintlayout" }
androidx-coordinatorlayout = { module = "androidx.coordinatorlayout:coordinatorlayout", version.ref = "androidxCoordinatorlayout" }
androidx-swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "androidxSwiperefresh" }
androidx-preference-ktx = { module = "androidx.preference:preference-ktx", version.ref = "androidxPreference" }
androidx-navigation-fragment-ktx = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "androidxNavigation" }
androidx-navigation-ui-ktx = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "androidxNavigation" }
material = { module = "com.google.android.material:material", version.ref = "material" }

# --- Test ---
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-work-testing = { module = "androidx.work:work-testing", version.ref = "androidxWork" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockitoKotlin" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
