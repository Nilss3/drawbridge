org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9's two migration switches, both off for now: the new DSL and AGP's own
# built-in Kotlin support would each rewrite every module's build file, and the
# move to AGP 9 was forced by the engine (GeckoView 154+ compiles only against
# SDK 37, which AGP 8 cannot target) rather than wanted for itself. Turning them
# on is a separate change.
android.newDsl=false
android.builtInKotlin=false

kotlin.code.style=official

# Dev channel. This branch's builds poll *this branch's* signed policy, not the
# one every alpha phone fetches from main — which is the whole point of the
# channel: a policy change can be tested without publishing it to every device.
# main has no such line, so a build from there behaves exactly as it always has.
drawbridgePolicyUrl=https://raw.githubusercontent.com/Nilss3/drawbridge/dev/dist/policy.signed.json
