name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Release APKs are what QR provisioning downloads and what the self-updater
# installs, so they must be signed with the one release key. Android rejects an
# update signed with a different key, which would strand every deployed device.
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test

      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DRAWBRIDGE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::DRAWBRIDGE_KEYSTORE_BASE64 is not set; refusing to publish unsigned APKs"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Assemble release APKs
        env:
          DRAWBRIDGE_KEYSTORE: ${{ runner.temp }}/release.jks
          DRAWBRIDGE_KEYSTORE_PASSWORD: ${{ secrets.DRAWBRIDGE_KEYSTORE_PASSWORD }}
          DRAWBRIDGE_KEY_ALIAS: ${{ secrets.DRAWBRIDGE_KEY_ALIAS }}
          DRAWBRIDGE_KEY_PASSWORD: ${{ secrets.DRAWBRIDGE_KEY_PASSWORD }}
        run: ./gradlew :herald:assembleRelease :dpc:assembleRelease

      - name: Collect checksums
        run: |
          mkdir -p release
          cp herald/build/outputs/apk/release/*.apk dpc/build/outputs/apk/release/*.apk release/
          cd release && sha256sum *.apk > SHA256SUMS

      # No QR regeneration here: the payload pins the signing *certificate*, not
      # the APK, so docs/img/provisioning-qr.png stays valid for every release
      # signed with the same key.
      #
      # No policy re-signing either. The policy key is meant to live offline, and
      # required_apps pins herald's APKs by checksum — so when herald's build
      # changes, update dist/policy.json from the SHA256SUMS published here and
      # re-sign locally. See docs/policy.md, "Build order matters".

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.apk
            release/SHA256SUMS
          fail_on_unmatched_files: true
