name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Verify the published policy is signed by a trusted key
        run: python3 tools/policytool.py verify

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test

      - name: Lint
        run: ./gradlew lint

      - name: Assemble debug APKs
        run: ./gradlew :herald:assembleDebug :dpc:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: |
            herald/build/outputs/apk/debug/*.apk
            dpc/build/outputs/apk/debug/*.apk
          if-no-files-found: error
